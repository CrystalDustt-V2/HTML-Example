<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Grades — solution</title>
</head>
<body>
    <h1>Grade table — Class 4A</h1>

    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Math</th>
                <th>English</th>
                <th>Science</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Alex</th>
                <td>A</td>
                <td>B</td>
                <td>A</td>
            </tr>
            <tr>
                <th>Maya</th>
                <td>B</td>
                <td>A</td>
                <td>B</td>
            </tr>
            <tr>
                <th>Leo</th>
                <td>A</td>
                <td>A</td>
                <td>C</td>
            </tr>
            <tr>
                <th>Nora</th>
                <td>B</td>
                <td>B</td>
                <td>A</td>
            </tr>
        </tbody>
    </table>

    <h2>A small table with a merged cell</h2>

    <table>
        <tr>
            <th colspan="2">School events — Spring 2026</th>
        </tr>
        <tr>
            <td>March 15</td>
            <td>Science fair</td>
        </tr>
        <tr>
            <td>May 2</td>
            <td>Sports day</td>
        </tr>
    </table>
</body>
</html>

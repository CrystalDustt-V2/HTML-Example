<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 02 — My Favorite Color</title>
    <style>
        /* Whole page: very light blue background, dark text */
        body {
            background-color: #eef4fb;
            color: #1a2a3a;
        }

        /* Heading: dark blue background, white text (hex for both) */
        h1 {
            color: #ffffff;
            background-color: #1f4e79;
        }

        /* The "did you know" paragraph gets a yellow highlight */
        .highlight {
            background-color: #ffe68a;
            color: #4a3a00;
        }

        /* The same blue, written three ways, in one place */
        .named {
            color: navy;
        }

        .hex {
            color: #000080;
        }

        .rgb {
            color: rgb(0, 0, 128);
        }
    </style>
</head>
<body>
    <h1>My favorite color: blue</h1>

    <p>Blue is calm and cool. It is the color of the sky on a clear day and
        the ocean at noon.</p>

    <p class="highlight">Did you know? The three lines below all use the same
        blue color, written in the three formats you learned.</p>

    <ul>
        <li class="named">named color: navy</li>
        <li class="hex">hex color: #000080</li>
        <li class="rgb">rgb color: rgb(0, 0, 128)</li>
    </ul>
</body>
</html>

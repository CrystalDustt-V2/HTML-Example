<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 05 — Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* The card: fixed width, centered, padded, bordered, rounded */
        .card {
            width: 360px;
            margin: 30px auto;
            padding: 20px 25px;
            border: 2px solid #1f4e79;
            border-radius: 10px;
            background-color: #eef4fb;
        }

        /* The hobby "chips" */
        .card li {
            display: inline-block;
            padding: 4px 10px;
            background-color: #dbe9f7;
            border-radius: 12px;
            margin-right: 6px;
        }

        /* The contact button */
        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sam Rivera</h1>

        <p>Front-end student who loves making things look clean and
            simple.</p>

        <ul>
            <li>Hiking</li>
            <li>Photography</li>
            <li>Baking</li>
        </ul>

        <a class="button" href="#">Contact me</a>
    </div>
</body>
</html>

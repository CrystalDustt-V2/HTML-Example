<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation — solution</title>
</head>
<body>
    <h1>My small website</h1>

    <h2>Navigation</h2>
    <!-- Home points to example.html because navigation.html is the file
         you create yourself in this exercise. -->
    <p>
        <a href="example.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a> |
        <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>
    </p>

    <h2>A link of my choice</h2>
    <p>
        I practice HTML with the free guide on
        <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.
    </p>
</body>
</html>

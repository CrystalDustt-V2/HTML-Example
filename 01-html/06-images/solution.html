<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Shape Gallery</title>
</head>
<body>
    <h1>My shape gallery</h1>

    <p>These three shapes live in the images folder of this lesson.</p>

    <img src="images/red-circle.svg" alt="A red circle" width="120" height="120">
    <img src="images/blue-square.svg" alt="A blue square" width="120" height="120">
    <img src="images/green-triangle.svg" alt="A green triangle" width="120" height="120">

    <p>And this one comes from another website, using a full URL:</p>

    <!-- Replace the URL with any image you like. -->
    <img src="https://picsum.photos/200/150" alt="A random photo from the Picsum service" width="200" height="150">

    <p>
        Source:
        <a href="https://picsum.photos/" target="_blank">
            Picsum — free placeholder photos
        </a>
    </p>
</body>
</html>

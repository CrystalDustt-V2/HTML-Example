<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 01 — My First CSS Rules</title>
    <style>
        /* Make the whole page a light gray so the content stands out */
        body {
            background-color: #f4f4f4;
        }

        /* The main heading: teal and large */
        h1 {
            color: teal;
            font-size: 40px;
        }

        /* Paragraphs: dark gray, a bit larger than the browser default */
        p {
            color: #333333;
            font-size: 18px;
        }

        /* Emphasized words stand out in orange */
        em {
            color: darkorange;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>My first CSS rules</h1>

    <p>This page has four rules. One styles the whole page, one styles the
        heading, one styles paragraphs, and one styles <em>emphasized</em>
        text.</p>

    <p>Every rule follows the same shape:
        <em>selector</em> { <em>property</em>: <em>value</em>; }</p>
</body>
</html>

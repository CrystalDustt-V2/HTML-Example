<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lesson 09 — Forms and Tables</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Fields: consistent padding, border, and corners */
        input, textarea, select {
            padding: 8px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
        }

        /* The active field is clearly visible */
        input:focus, textarea:focus, select:focus {
            border-color: #1f4e79;
            outline: 2px solid #1f4e79;
            outline-offset: 1px;
        }

        /* Button */
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b22222;
        }

        /* Table: one clean grid */
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 10px 14px;
            text-align: left;
        }

        thead th {
            background-color: #1f4e79;
            color: white;
        }

        /* Zebra stripes on odd rows */
        tbody tr:nth-child(odd) {
            background-color: #eef4fb;
        }
    </style>
</head>
<body>
    <h1>Forms and tables</h1>

    <form>
        <p>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" placeholder="Your name">
        </p>
        <p>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="3" placeholder="Say hello"></textarea>
        </p>
        <button type="submit">Send</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex</td>
                <td>Math</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Sam</td>
                <td>History</td>
                <td>B</td>
            </tr>
            <tr>
                <td>Riley</td>
                <td>Science</td>
                <td>A</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
